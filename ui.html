<!DOCTYPE html>
<html>
  <head>
    <title>Colour Documentation</title>
    <!--Styles-->
    <style>
      :root {
        scrollbar-gutter: stable;
      }
      body {
        font-family: Helvetica, Arial, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px 16px;
      }

      /* Colours */
      .high-emphasis {
        color: rgba(0, 0, 0, 0.9);
      }
      .medium-emphasis {
        color: rgba(0, 0, 0, 0.81);
      }

      h1 {
        font-size: 21px;
        line-height: 24px;
        font-weight: 700;
        letter-spacing: -0.25px;
        margin: 0;
      }

      h2 {
        font-size: 15px;
        line-height: 16px;
        margin: 0;
      }

      .flex {
        display: flex;
      }
      .col {
        flex-direction: column;
      }
      .row {
        flex-direction: row;
      }
      .items-start {
        align-items: flex-start;
      }
      .items-center {
        align-items: center;
      }
      .gap-8 {
        gap: 8px;
      }
      .gap-16 {
        gap: 16px;
      }
      .gap-24 {
        gap: 24px;
      }
      .gap-32 {
        gap: 32px;
      }

      .form-elements {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      button {
        display: flex;
        align-items: center;
        height: 40px;
        margin: 0;
        margin-right: 8px;
        padding: 0px 24px;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .btn-prm {
        background-color: #000;
        color: #fff;
      }

      .btn-prm.btn-dis {
        background-color: rgba(0, 0, 0, 0.33);
        color: rgba(255, 255, 255, 0.75);
      }

      /* Accordion Items */
      .accordion-header {
        display: flex;
        flex-direction: row;
        align-items: center;
        cursor: pointer;
        width: 100%;
        height: 40px;
        border-top: 1px solid rgba(0, 0, 0, 0.25);
      }

      .accordion-content {
        display: none;
        width: 100%;
      }

      .accordion-header,
      .accordion-content {
        align-self: stretch;
      }

      .accordion-title {
        flex: 1 0 120px;
      }

      .accordion-icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        transition: transform 0.15s ease-in-out;
      }

      .messages {
        display: flex;
        flex-direction: column;
      }

      .body-small {
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
        letter-spacing: .06px
      }

      #errorMessage {
        color: #c00027;
      }

      #successMessage {
        color: #1d6d00;
      }

      label {
        flex: 0 0 120px; /* fixed label width inside flex row */
        color: rgba(0, 0, 0, 0.81);
      }

      input {
        flex: 1 1 auto;          /* let the input take remaining space */
        min-width: 0;            /* allow shrinking in flex containers */
        max-width: 100%;
        padding: 8px 10px;
        box-sizing: border-box;  /* include padding in width */
        height: 32px;
        border-radius: 4px;
        border: 0.5px solid rgba(0, 0, 0, 0.05);
        background: #FFF;
        box-shadow: 0 4px 9px 0 rgba(9, 17, 31, 0.03) inset, 0 1px 15px 0 rgba(9, 17, 31, 0.06) inset, 0 2px 8px 0 rgba(9, 17, 31, 0.09) inset;
        color: rgba(0, 0, 0, 0.81);
      }

      .text-field {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;              /* make each row span container width */
      }
    </style>
  </head>

  <!--Plugin HTML-->

  <body>
    <div class="flex col gap-16">
      <div class="flex col items-start gap-24">
        <div class="flex col gap-8">
          <h1 class="high-emphasis">Colour Documentation</h1>
          <div class="messages">
            <div class="default-message body-small medium-emphasis" id="defaultMessage">
              Choose a frame with swatches to get started.
            </div>
            <div class="body-small" id="successMessage"></div>
            <div class="body-small" id="errorMessage"></div>
          </div>
        </div>
        <button class="btn-prm btn-dis" id="btnWrite">Update values</button>
        <div class="body-small medium-emphasis">
          Get the swatch component <a href="figma link here">here</a>
        </div>
      </div>
      <div class="flex col gap-8">
      <div class="accordion-header" id="accordionHeader">
        <h2 class="high-emphasis accordion-title">Advanced Options</h2>
        <svg
          class="accordion-icon"
          id="accordionIcon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M11.2929 12.8787C11.6834 13.2692 12.3166 13.2692 12.7071 12.8787L17.2929 8.29289C17.6834 7.90237 18.3166 7.90237 18.7071 8.29289C19.0976 8.68341 19.0976 9.31658 18.7071 9.7071L14.1213 14.2929C12.9497 15.4645 11.0503 15.4645 9.87868 14.2929L5.29289 9.7071C4.90237 9.31658 4.90237 8.68341 5.29289 8.29289C5.68342 7.90236 6.31658 7.90237 6.70711 8.29289L11.2929 12.8787Z"
            fill="black"
          />
        </svg>
      </div>
      <div id="accordionContent" class="accordion-content">
        <div class="form-elements">
          <div class="text-field">
            <label class="body-small" for="parentLayerNameInput">Parent Layer</label>
            <input
              type="text"
              id="parentLayerNameInput"
              value="Swatch Block"
              placeholder="Enter parent layer name"
            />
          </div>

          <div class="text-field">
            <label class="body-small" for="colourLayerNameInput">Color Layer</label>
            <input
              type="text"
              id="colourLayerNameInput"
              value="Swatch Colour"
              placeholder="Enter color layer name"
            />
          </div>

          <div class="text-field">
            <label class="body-small" for="hexLayerNameInput">Hex Field</label>
            <input
              type="text"
              id="hexLayerNameInput"
              value="Hex Value"
              placeholder="Enter Hex field name"
            />
          </div>

          <div class="text-field">
            <label class="body-small" for="rgbLayerNameInput">RGB Field</label>
            <input
              type="text"
              id="rgbLayerNameInput"
              value="RGB Value"
              placeholder="Enter RGB field name"
            />
          </div>

          <div class="text-field">
            <label class="body-small" for="hsbLayerNameInput">HSB Field</label>
            <input
              type="text"
              id="hsbLayerNameInput"
              value="HSB Value"
              placeholder="Enter HSB field name"
            />
          </div>

          <div class="text-field">
            <label class="body-small" for="hslLayerNameInput">HSL Field</label>
            <input
              type="text"
              id="hslLayerNameInput"
              value="HSL Value"
              placeholder="Enter HSL field name"
            />
          </div>
          <div class="text-field">
            <label class="body-small" for="hctLayerNameInput">HCT Field</label>
            <input
              type="text"
              id="hctLayerNameInput"
              value="HCT Value"
              placeholder="Enter HCT field name"
            />
          </div>
          </div>
        </div>
      </div>
      </div>
    </div>
    <!--Plugin Scripts-->
    <script>
      // DOM helpers
      const $ = (id) => document.getElementById(id);
      const val = (id) => $(id)?.value ?? "";

      // UI Methods
      $("accordionHeader").addEventListener("click", toggleAccordion);
      $("btnWrite").addEventListener("click", writeLayers);

      // On Message events when figma talks ot the UI
      onmessage = (event) => {
        const pluginMessage = event.data.pluginMessage;

        if (!pluginMessage) {
          console.error(
            "No pluginMessage found in the event data:",
            event.data
          );
          return;
        }

        const { type, message } = pluginMessage;

        switch (type) {
          case "load-status":
            showMessage("default", message);
            break;

          case "load-success":
          case "run-success":
            showMessage("success", message);
            if (pluginMessage.disableWrite) {
              setButton("btnWrite", { disabled: true });
            } else {
              setButton("btnWrite", { disabled: false });
            }
            break;

          case "selection-exists":
            autoLoadLayers();
            break;

          case "no-selection":
            // Clear all messages and show the default state
            showMessage(
              "default",
              "Select a frame with swatches to get started."
            );
            setButton("btnWrite", { disabled: true });
            break;

          case "error":
            showMessage("error", message);
            setButton("btnWrite", { disabled: true });
            break;

          case "objects-found":
            if (message === 0 || message === "0") {
              showMessage("error", "Oops! No swatch blocks found.");
              setButton("btnWrite", { disabled: true });
            } else {
              showMessage("success", `Found ${message} swatch blocks.`);
              setButton("btnWrite", { disabled: false });
            }
            break;

          default:
            console.warn("Unknown message type received:", type);
        }
      };

      // On plugin UI load, check if a selection exists in Figma
      window.addEventListener("DOMContentLoaded", () => {
        parent.postMessage({ pluginMessage: { type: "check-selection" } }, "*");
        showMessage("default", "Select a frame to get started.");
        setButton("btnWrite", { disabled: true });
      });

      // Cache message elements (avoid re-query on every showMessage call)
      const MSG = {
        defaultMessage: $("defaultMessage"),
        successMessage: $("successMessage"),
        errorMessage: $("errorMessage"),
      };

      // Single list of field IDs shared by load/write flows
      const FIELD_IDS = [
        "parentLayerNameInput",
        "colourLayerNameInput",
        "hexLayerNameInput",
        "rgbLayerNameInput",
        "hsbLayerNameInput",
        "hslLayerNameInput",
        "hctLayerNameInput",
      ];

      function readForm() {
        return FIELD_IDS.reduce((acc, id) => {
          acc[id.replace("Input", "")] = val(id);
          return acc;
        }, {});
      }

      // Auto-load layers if selection exists
      function autoLoadLayers() {
        parent.postMessage(
          { pluginMessage: { type: "get-values", ...readForm() } },
          "*"
        );
      }

      // Function to write color values into Figma layers
      function writeLayers() {
        parent.postMessage(
          { pluginMessage: { type: "write-data", ...readForm() } },
          "*"
        );
      }

      /* Show a message in id with content as params. */
      function showMessage(key, content) {
        // Hide all so only one shows at a time
        Object.values(MSG).forEach((el) => (el.style.display = "none"));

        const map = {
          default: MSG.defaultMessage,
          success: MSG.successMessage,
          error: MSG.errorMessage,
          defaultMessage: MSG.defaultMessage,
          successMessage: MSG.successMessage,
          errorMessage: MSG.errorMessage,
        };

        const target = map[key] || MSG.defaultMessage;
        target.textContent = content;
        target.style.display = "block";
      }

      /* Toggles accordion content to hidden or shown */
      function toggleAccordion() {
        const accState = $("accordionContent");
        const accIcon = $("accordionIcon");
        const isOpen = accState.style.display === "block";
        accState.style.display = isOpen ? "none" : "block";
        accIcon.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
      }

      /* Sets a button with an ID to a type and state */
      function setButton(buttonID, { disabled } = {}) {
        const button = $(buttonID);
        if (!button) return;

        // always apply primary look
        button.classList.add("btn-prm");

        if (disabled) {
          button.classList.add("btn-dis");
          button.setAttribute("disabled", "disabled");
        } else {
          button.classList.remove("btn-dis");
          button.removeAttribute("disabled");
        }
      }
    </script>
  </body>
</html>
